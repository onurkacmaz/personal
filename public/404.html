<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Onur Kaçmaz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<script>try{if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');document.querySelector('meta[name="theme-color"]').setAttribute('content','#0d0d0d')}}catch(e){}</script>
<link rel="icon" href="/img/portrait.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#fff;
  --text:#171717;
  --text-2:#525252;
  --muted:#767676;
  --line:#ebebeb;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d;
  --text:#ededed;
  --text-2:#a3a3a3;
  --muted:#9b9b9b;
  --line:#262626;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
main{max-width:420px}
p{margin:0 0 12px}
.code{font-size:14px;line-height:22px;color:var(--muted);margin:0 0 14px}
h1{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em;margin:0 0 12px}
.lead{color:var(--text-2);margin:0 0 24px}
a.home{
  color:var(--text);border-bottom:1px solid var(--line);padding-bottom:1px;
  text-decoration:none;transition:border-color .15s ease;
}
a.home:hover{border-bottom-color:var(--muted)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>There is nothing here.</h1>
  <p class="lead">The page you asked for does not exist, or it never did.</p>
  <a class="home" href="/">Back to onurkacmaz.com</a>
</main>
</body>
</html>
